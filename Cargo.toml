[package]
name = "kdmspor"
version = "1.0.0"
description = "KDM dogrulama ve klasorleme"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
